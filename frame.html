<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀 — 걸어서 성경 속으로</title>
<link rel="icon" href="icons/favicon-32.png"><link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;font-family:"Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 30% 20%,#e9edf7,#cfd6e8 60%,#b9c2da);color:#2a2f45}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px;box-sizing:border-box}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));border-radius:54px;background:#111;padding:12px;box-shadow:0 40px 80px rgba(30,40,80,.35),inset 0 0 0 2px #333}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#5c76b8;display:flex;flex-direction:column}
.status{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;color:#fff;font-weight:600;font-size:15px;background:#5c76b8}
.status .ic{display:flex;gap:6px;align-items:center}
.status .bat{width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}
.status .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1px}
.screen iframe{flex:1;width:100%;border:0;background:#fff;display:block}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:32px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
.home{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:rgba(0,0,0,.35);z-index:2;pointer-events:none}
.side{max-width:300px}
.side img{width:88px;height:88px;border-radius:20px;box-shadow:0 10px 24px rgba(40,60,120,.3)}
.side h1{font-size:30px;margin:18px 0 6px}
.side p{line-height:1.7;color:#4a5170;margin:0 0 14px;font-size:15px}
.side .qr{font-size:13px;color:#6a7190}
.side a{color:#3f55a0}
@media (max-width:820px){.side{display:none}}
</style></head><body>
<div class="wrap">
  <div class="side">
    <img src="icons/icon-512.png" alt="">
    <h1>말씀</h1>
    <p>개역한글 · KJV 성경을 인물·장소·시간과 함께 읽는 앱이에요.</p>
    <p class="qr">휴대폰에서 이 주소를 열고 <b>홈 화면에 추가</b>하면 앱처럼 쓸 수 있어요.<br><a href="./?noframe=1">큰 화면으로 보기</a></p>
  </div>
  <div class="phone"><div class="notch"></div><div class="screen"><div class="status"><span id="clock">9:41</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><span class="bat"></span></span></div><iframe id="f" title="말씀 앱" allow="autoplay; fullscreen"></iframe></div><div class="home"></div></div>
</div>
<script>document.getElementById('f').src='./?inframe=1'+location.hash;
(function t(){var d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');setTimeout(t,30000)})();</script>
</body></html>
